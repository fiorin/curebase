services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinical
      POSTGRES_USER: clinical
      POSTGRES_PASSWORD: clinical
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical -d clinical"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://clinical:clinical@db:5432/clinical?schema=public
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
